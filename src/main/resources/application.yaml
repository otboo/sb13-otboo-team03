spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  profiles:
    default: dev
  application:
    name: sb13-otboo-team03
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 50
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: ${KAFKA_PRODUCER_IDEMPOTENCE:true}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:30000}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:10000}
        sasl.jaas.config: >-
          ${KAFKA_PRODUCER_SASL_JAAS_CONFIG:org.apache.kafka.common.security.plain.PlainLoginModule required
          username='${KAFKA_RELAY_API_KEY:}' password='${KAFKA_RELAY_API_SECRET:}';}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:otboo-notification}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        sasl.jaas.config: ${KAFKA_CONSUMER_SASL_JAAS_CONFIG:${KAFKA_SASL_JAAS_CONFIG:}}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

otboo:
  recommendation:
    llm:
      enabled: ${RECOMMENDATION_LLM_ENABLED:false}
      model: ${GROQ_RECOMMENDATION_MODEL:openai/gpt-oss-120b}
      max-clothes: 80
      max-input-characters: 12000
      max-completion-tokens: 2048

  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    name: ${ADMIN_NAME:관리자}

  jwt:
    secret: ${JWT_SECRET}
    access-token-validity: 30m
    refresh-token-validity: 7d
    cookie-secure: ${JWT_COOKIE_SECURE:false}

  storage: ${STORAGE_TYPE:local}
  s3:
    bucket: ${S3_BUCKET_NAME}
    region: ${AWS_REGION:ap-northeast-2}
    presign-minutes: 5

  cache:
    default-ttl: 5m
    ttls: { }

  redis:
    notification-channel: ${REDIS_NOTIFICATION_CHANNEL:otboo:notifications}
    notification-publish:
      max-attempts: ${REDIS_NOTIFICATION_PUBLISH_MAX_ATTEMPTS:3}
      backoff-ms: ${REDIS_NOTIFICATION_PUBLISH_BACKOFF_MS:200}
    direct-message-channel: ${REDIS_DIRECT_MESSAGE_CHANNEL:otboo:direct-messages}
    jwt-revocation-channel: otboo:jwt-revocations

  sse:
    replay-limit: ${SSE_REPLAY_LIMIT:100}

  outbox:
    relay:
      fixed-delay: ${OUTBOX_RELAY_FIXED_DELAY:PT5S}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:100}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:https://d1urpq6rj5swu.cloudfront.net,http://localhost:*,http://127.0.0.1:*}
  kafka:
    notification-topic: ${KAFKA_NOTIFICATION_TOPIC:otboo.notification.events}
    notification-dlt-topic: ${KAFKA_NOTIFICATION_DLT_TOPIC:otboo.notification.events.DLT}
    producer:
      send-timeout: ${KAFKA_PRODUCER_SEND_TIMEOUT:PT30S}
    consumer:
      retry-backoff-ms: ${KAFKA_CONSUMER_RETRY_BACKOFF_MS:1000}
      retry-max-attempts: ${KAFKA_CONSUMER_RETRY_MAX_ATTEMPTS:2}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db

kakao:
  api:
    key: ${KAKAO_API_KEY:}

groq:
  api-key: ${GROQ_API_KEY:}
  connect-timeout: 2s
  read-timeout: 8s

openweather:
  api:
    key: ${OPENWEATHER_API_KEY:}
    base-url: https://api.openweathermap.org

scheduler:
  sse-heartbeat:
    fixed-delay: ${SSE_HEARTBEAT_FIXED_DELAY:PT15S}

---
spring:
  config:
    activate:
      on-profile: "dev | prod"
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          kakao:
            client-id: ${KAKAO_OAUTH_CLIENT_ID}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
