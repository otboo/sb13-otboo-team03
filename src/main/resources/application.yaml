spring:
  profiles:
    default: dev
  application:
    name: sb13-otboo-team03
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

otboo:
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity: 30m
    refresh-token-validity: 7d
    cookie-secure: ${JWT_COOKIE_SECURE:false}